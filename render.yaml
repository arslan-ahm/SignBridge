services:
  - type: web
    name: signbridge-api
    runtime: python
    rootDir: backend/api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SENTENCE_TASK_SLUG
        value: build_sentence
